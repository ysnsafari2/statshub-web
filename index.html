<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Statshub</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15161B; --card:#1E2028; --card2:#262833; --line:rgba(255,255,255,.07);
  --ink:#F3F4F7; --muted:#8D93A1; --dim:#5C606C;
  --grad1:linear-gradient(135deg,#FF7A59 0%,#FF3D71 100%);
  --grad2:linear-gradient(135deg,#4F7CFF 0%,#3DDBFF 100%);
  --green:#3DDC84; --pink:#FF3D71;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; color:var(--ink); font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  background:#08090C url('bg.jpg') no-repeat top center;
  background-size:100% auto;
  background-attachment:local;
}
#app{max-width:480px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;}
header{padding:22px 20px 14px; display:flex; align-items:center; gap:12px;}
header .logos{width:40px; height:40px; border-radius:12px; background:var(--card2); display:flex; align-items:center; justify-content:center; font-size:19px;}
header h1{font-family:'Manrope'; font-size:17px; margin:0; font-weight:800;}
header p{margin:0; font-size:11.5px; color:var(--dim);}
header .dots{margin-left:auto; color:var(--dim); font-size:19px; letter-spacing:1px;}
.searchbar{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line);
  border-radius:14px; padding:13px 16px; color:var(--dim); font-size:13.5px; margin:0 20px 4px;}
main{flex:1; padding:0 20px 96px;}
.hero{border-radius:22px; padding:22px 20px; margin:16px 0 20px; background:var(--grad1); position:relative; overflow:hidden;}
.hero .chip{position:absolute; top:18px; right:18px; font-size:10.5px; background:rgba(0,0,0,.22); padding:5px 10px; border-radius:999px; color:#fff; letter-spacing:.4px;}
.hero h2{font-family:'Manrope'; font-size:23px; margin:0 0 6px; font-weight:800; color:#fff;}
.hero p{margin:0; font-size:13.5px; line-height:1.5; color:rgba(255,255,255,.85); max-width:85%;}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.tile{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px 16px; cursor:pointer;}
.tile .ic{width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; margin-bottom:14px;}
.tile:nth-child(1) .ic{background:rgba(255,122,89,.15);}
.tile:nth-child(2) .ic{background:rgba(79,124,255,.15);}
.tile:nth-child(3) .ic{background:rgba(61,220,132,.15);}
.tile:nth-child(4) .ic{background:rgba(255,61,113,.15);}
.tile span{font-family:'Manrope'; font-weight:700; font-size:13.5px; display:block;}
.section-title{font-family:'Manrope'; font-weight:800; font-size:15px; margin:4px 0 12px;}
.row{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:10px;
  display:flex; align-items:center; justify-content:space-between; cursor:pointer;}
.row .left{display:flex; align-items:center; gap:12px;}
.row .badge{width:34px; height:34px; border-radius:10px; background:var(--card2); display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;}
.row .label{font-family:'Manrope'; font-weight:700; font-size:14px;}
.row .chev{color:var(--dim); font-size:13px; transition:transform .15s;}
.row.open .chev{transform:rotate(90deg); color:var(--ink);}
.tabs{display:flex; gap:8px; margin:2px 0 14px 46px;}
.tab{background:var(--card2); border-radius:999px; padding:9px 16px; font-size:12.5px; font-weight:600; color:var(--muted); cursor:pointer;}
.tab.active{background:var(--ink); color:#15161B;}
.playergrid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.pcard{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px; display:flex; align-items:center; gap:9px; cursor:pointer;}
.pcard .av{width:28px; height:28px; border-radius:50%; background:var(--grad2); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; color:#fff;}
.pcard span{font-size:12.5px; font-weight:600;}
.playerhero{border-radius:20px; padding:18px 18px; margin-bottom:16px; background:var(--grad2);}
.playerhero h2{font-family:'Manrope'; font-size:19px; margin:0; font-weight:800; color:#fff;}
.playerhero p{margin:4px 0 0; font-size:12px; color:rgba(255,255,255,.8);}
table{width:100%; border-collapse:separate; border-spacing:0; font-size:11px; margin-bottom:14px;
  background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden;}
th{background:var(--card2); color:var(--muted); padding:10px 4px; font-family:'Manrope'; font-weight:700; font-size:9.5px;
  text-transform:uppercase; letter-spacing:.3px;}
td{padding:10px 4px; text-align:center; border-top:1px solid var(--line); color:var(--ink);}
td:first-child,th:first-child{text-align:left; padding-left:12px;}
td:nth-child(2){color:var(--green); font-weight:700;}
.key{font-size:11px; color:var(--muted); line-height:1.9; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px;}
.key b{color:var(--ink); font-family:'Manrope';}
.back{color:var(--ink); font-weight:600; font-size:13px; margin-bottom:16px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; opacity:.75;}
.back:before{content:"←";}
.soon,.loading{text-align:center; padding:70px 10px; color:var(--dim); font-size:13px;}
.soon .e{font-size:38px; display:block; margin-bottom:14px;}
nav.bottomnav{position:sticky; bottom:0; background:#0C0D11; border-top:1px solid rgba(255,255,255,.06); display:flex; padding:16px 6px 20px;}
nav.bottomnav .item{flex:1; text-align:center; color:#6B6F79; font-size:10px; font-weight:600; cursor:pointer;}
nav.bottomnav .item .ic{width:100%; height:24px; margin:0 auto 7px; display:flex; align-items:center; justify-content:center;}
nav.bottomnav .item .ic svg{width:22px; height:22px;}
nav.bottomnav .item .ic-filled{display:none;}
nav.bottomnav .item.active{color:#F3F4F7; font-weight:800;}
nav.bottomnav .item.active .ic-outline{display:none;}
nav.bottomnav .item.active .ic-filled{display:flex;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logos">🏆</div>
    <div><h1>Statshub</h1><p>for teams and players stats</p></div>
    <div class="dots">⋯</div>
  </header>
  <div class="searchbar">🔍 Search your Team or Player</div>
  <main id="screen"><div class="loading">Loading...</div></main>
  <nav class="bottomnav" id="bottomnav">
    <div class="item" data-nav="home">
      <div class="ic ic-outline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1h4v-6h3v6h4a1 1 0 0 0 1-1v-9"/></svg></div>
      <div class="ic ic-filled"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 2.5 11h2.3v8.3c0 .7.6 1.2 1.2 1.2h4.3v-6.2h3.4v6.2h4.3c.7 0 1.2-.6 1.2-1.2V11h2.3z"/></svg></div>
      Home
    </div>
    <div class="item" data-nav="home">
      <div class="ic ic-outline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
      <div class="ic ic-filled"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
      Search
    </div>
    <div class="item" data-nav="football">
      <div class="ic ic-outline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8.2 15 10l-1.1 3.4H10.1L9 10z"/><path d="M12 3v5.2M9 13.4l-4.8 1.6M15 13.4l4.8 1.6M9.8 10l-3.3-3.6M14.2 10l3.3-3.6"/></svg></div>
      <div class="ic ic-filled"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8.2 15 10l-1.1 3.4H10.1L9 10z"/><path d="M12 3v5.2M9 13.4l-4.8 1.6M15 13.4l4.8 1.6M9.8 10l-3.3-3.6M14.2 10l3.3-3.6"/></svg></div>
      Football
    </div>
    <div class="item" data-nav="basketball">
      <div class="ic ic-outline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18M6.2 5.3c2.7 3.2 2.7 10.2 0 13.4M17.8 5.3c-2.7 3.2-2.7 10.2 0 13.4"/></svg></div>
      <div class="ic ic-filled"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18M6.2 5.3c2.7 3.2 2.7 10.2 0 13.4M17.8 5.3c-2.7 3.2-2.7 10.2 0 13.4"/></svg></div>
      Basketball
    </div>
  </nav>
</div>
<script>
const SUPA_URL = "https://owajohfpdbamadwbpquc.supabase.co";
const SUPA_KEY = "sb_publishable_nVE43GD0kaiUsr3mt3JpMw_aejdjDZf";

async function supa(path){
  try{
    const res = await fetch(`${SUPA_URL}/rest/v1/${path}`, {
      headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}` }
    });
    if(!res.ok){ console.error("Supabase error on", path, await res.text()); return []; }
    return await res.json();
  }catch(e){ console.error(e); return []; }
}

function disp(v){ return (v===null||v===undefined) ? "-" : v; }
function fmtDate(iso){ if(!iso) return "-"; const [y,m,d]=iso.split("-"); return `${d}-${m}-${y}`; }
function initials(name){ return name.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase(); }

let state={screen:'home'};
const root=document.getElementById('screen');
function go(s){ state=Object.assign({},state,s); render(); }

document.querySelectorAll('#bottomnav .item').forEach(el=>{
  el.addEventListener('click', ()=>{
    const target = el.dataset.nav;
    if(target==='home') go({screen:'home'});
    else if(target==='football') go({screen:'football-teams'});
    else if(target==='basketball') go({screen:'soon'});
  });
});
function updateNav(){
  const footballScreens = ['football-teams','league','team-stats','players-list','player'];
  let active = 'home';
  if(footballScreens.includes(state.screen)) active='football';
  document.querySelectorAll('#bottomnav .item').forEach(el=>{
    el.classList.toggle('active', el.dataset.nav===active);
  });
}

function tableHTML(headers,rowLabels,dataRows){
  let h='<table><tr>'+headers.map(x=>`<th>${x}</th>`).join('')+'</tr>';
  rowLabels.forEach((label,i)=>{
    h+='<tr><td>'+label[0]+'<br><small style="color:var(--dim)">'+label[1]+'</small></td>'+dataRows[i].map(v=>`<td>${disp(v)}</td>`).join('')+'</tr>';
  });
  return h+'</table>';
}

async function render(){
  updateNav();
  let h='';
  if(state.screen==='home'){
    h+=`<div class="hero"><span class="chip">STATS HUB</span><h2>Statshub</h2><p>a simple hub to track and showcase stats for teams and players.</p></div>
    <div class="section-title">Browse</div>
    <div class="grid">
      <div class="tile" onclick="go({screen:'football-teams'})"><div class="ic">🛡️</div><span>Football Teams</span></div>
      <div class="tile" onclick="go({screen:'soon'})"><div class="ic">👕</div><span>Football Players</span></div>
      <div class="tile" onclick="go({screen:'soon'})"><div class="ic">🏀</div><span>Basketball Teams</span></div>
      <div class="tile" onclick="go({screen:'soon'})"><div class="ic">🎽</div><span>Basketball Players</span></div>
    </div>`;
    root.innerHTML=h; return;
  }
  if(state.screen==='soon'){
    root.innerHTML=`<span class="back" onclick="go({screen:'home'})">Back</span><div class="soon"><span class="e">🚧</span>Coming soon</div>`; return;
  }

  root.innerHTML='<div class="loading">Loading...</div>';

  if(state.screen==='football-teams'){
    const countries = await supa(`countries?select=id,name&order=id.asc`);
    const flags={Spain:"🇪🇸",England:"🏴",France:"🇫🇷",Italy:"🇮🇹",Germany:"🇩🇪",Portugal:"🇵🇹"};
    h+=`<span class="back" onclick="go({screen:'home'})">Home</span><div class="section-title">Countries</div>`;
    for(const c of countries){
      const isOpen = state.open===c.id;
      h+=`<div class="row ${isOpen?'open':''}" onclick="go({screen:'football-teams',open:${isOpen?'null':c.id}})">
        <div class="left"><div class="badge">${flags[c.name]||"🏳️"}</div><span class="label">${c.name}</span></div>
        <span class="chev">›</span></div>`;
      if(isOpen){
        const leagues = await supa(`leagues?select=id,name&country_id=eq.${c.id}&order=id.asc`);
        if(leagues.length===0){ h+=`<div class="tabs" style="margin-bottom:14px;"><span class="tab">Coming soon</span></div>`; }
        else{
          h+=`<div class="tabs">`+leagues.map(l=>`<span class="tab" onclick="event.stopPropagation();go({screen:'league',leagueId:${l.id},leagueName:'${l.name}',countryId:${c.id}})">${l.name}</span>`).join('')+`</div>`;
        }
      }
    }
  } else if(state.screen==='league'){
    const teams = await supa(`teams?select=id,name&league_id=eq.${state.leagueId}&order=id.asc`);
    h+=`<span class="back" onclick="go({screen:'football-teams',open:${state.countryId||1}})">Back</span>
    <div class="section-title">${state.leagueName}</div>`;
    for(const t of teams){
      const isOpen = state.openTeam===t.id;
      h+=`<div class="row ${isOpen?'open':''}" onclick="go({screen:'league',leagueId:state.leagueId,leagueName:state.leagueName,countryId:state.countryId,openTeam:${isOpen?'null':t.id}})">
        <div class="left"><div class="badge">🛡️</div><span class="label">${t.name}</span></div>
        <span class="chev">›</span></div>`;
      if(isOpen){
        h+=`<div class="tabs">
          <span class="tab" onclick="event.stopPropagation();go({screen:'team-stats',teamId:${t.id},teamName:'${t.name}'})">Team Stats</span>
          <span class="tab" onclick="event.stopPropagation();go({screen:'players-list',teamId:${t.id},teamName:'${t.name}'})">Players Stats</span>
        </div>`;
      }
    }
  } else if(state.screen==='team-stats'){
    const matches = await supa(`matches?select=id,opponent,match_date&team_id=eq.${state.teamId}&order=match_date.desc&limit=20`);
    const ids = matches.map(m=>m.id);
    const stats = ids.length ? await supa(`team_stats?select=*&match_id=in.(${ids.join(',')})`) : [];
    const byMatch = {}; stats.forEach(s=>byMatch[s.match_id]=s);

    const rowLabels = matches.map(m=>[m.opponent, fmtDate(m.match_date)]);
    const dataRows = matches.map(m=>{
      const s = byMatch[m.id] || {};
      return [s.goals,s.total_shots,s.shots_on_target,s.passes,s.corners,s.throw_ins,s.fouls,s.yellow_cards,s.red_cards,s.offsides,s.headed_goals,s.gk_saves,s.woodwork];
    });

    h+=`<span class="back" onclick="go({screen:'league',leagueId:state.leagueId,leagueName:state.leagueName,countryId:state.countryId,openTeam:state.teamId})">Back</span>
    <div class="playerhero"><h2>${state.teamName}</h2><p>Team stats · last ${matches.length} matches</p></div>`;
    if(matches.length===0){ h+=`<div class="soon"><span class="e">📭</span>No synced matches yet</div>`; }
    else {
      h+=tableHTML(["Opponent","G","TS","SOT","P","Cnr","TI","F","Y","R","Off","HG","GS","Wd"],rowLabels,dataRows)
      +`<div class="key"><b>Key</b><br>G: Goals · TS: Total shots · SOT: Shots on target · P: Passes · Cnr: Corners · TI: Throw ins · F: Fouls · Y: Yellow · R: Red · Off: Offsides · HG: Headed goals · GS: GK saves · Wd: Woodwork</div>`;
    }
  } else if(state.screen==='players-list'){
    const players = await supa(`players?select=id,name&team_id=eq.${state.teamId}&order=id.asc`);
    h+=`<span class="back" onclick="go({screen:'league',leagueId:state.leagueId,leagueName:state.leagueName,countryId:state.countryId,openTeam:state.teamId})">${state.teamName}</span>
    <div class="section-title">${state.teamName} Players</div>
    <div class="playergrid">`
    +players.map(p=>`<div class="pcard" onclick="go({screen:'player',playerId:${p.id},playerName:'${p.name}',teamId:state.teamId,teamName:state.teamName,leagueId:state.leagueId,leagueName:state.leagueName,countryId:state.countryId})"><div class="av">${initials(p.name)}</div><span>${p.name}</span></div>`).join('')
    +`</div>`;
  } else if(state.screen==='player'){
    const matches = await supa(`matches?select=id,opponent,match_date&team_id=eq.${state.teamId}&order=match_date.desc&limit=20`);
    const ids = matches.map(m=>m.id);
    const pstats = ids.length ? await supa(`player_stats?select=*&player_id=eq.${state.playerId}&match_id=in.(${ids.join(',')})`) : [];
    const byMatch = {}; pstats.forEach(s=>byMatch[s.match_id]=s);

    const played = matches.filter(m=>byMatch[m.id]);
    const rowLabels = played.map(m=>[m.opponent, fmtDate(m.match_date)]);
    const dataRows = played.map(m=>{
      const s = byMatch[m.id];
      return [s.minutes,s.goals,s.assists,s.total_shots,s.shots_on_target,s.tackles,s.fouls,s.fouls_suffered,s.passes,s.yellow_cards,s.red_cards];
    });

    h+=`<span class="back" onclick="go({screen:'players-list',teamId:state.teamId,teamName:state.teamName,leagueId:state.leagueId,leagueName:state.leagueName,countryId:state.countryId})">Players</span>
    <div class="playerhero"><h2>${state.playerName}</h2><p>Player stats · last ${played.length} matches</p></div>`;
    if(played.length===0){ h+=`<div class="soon"><span class="e">📭</span>No synced stats yet for this player</div>`; }
    else {
      h+=tableHTML(["Opponent","Min","G","A","TS","SOT","Tkl","F","FS","P","Y","R"],rowLabels,dataRows)
      +`<div class="key"><b>Key</b><br>Min: Minutes · G: Goals · A: Assists · TS: Total shots · SOT: Shots on target · Tkl: Tackles · F: Fouls · FS: Fouls suffered · P: Passes · Y: Yellow · R: Red</div>`;
    }
  }
  root.innerHTML=h;
}
render();
</script>
</body>
</html>
